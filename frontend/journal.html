<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Journal — MindSpace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/app.css"/>
  <style>
    .journal-title { width:100%;background:transparent;border:none;outline:none;font-family:var(--font-headline);font-size:clamp(1.75rem,4vw,3rem);font-weight:800;color:var(--on-surface);letter-spacing:-0.02em; }
    .journal-title::placeholder { color:rgba(42,53,50,0.2); }
    .journal-body  { width:100%;min-height:20rem;background:transparent;border:none;outline:none;font-family:var(--font-body);font-size:1.1rem;line-height:1.8;color:var(--on-surface);resize:none; }
    .journal-body::placeholder { color:rgba(42,53,50,0.2); }
    .ai-btn { background:var(--surface-container-lowest);border:1px solid rgba(169,180,176,0.15);border-radius:var(--radius-full);padding:0.6rem 1.25rem;font-family:var(--font-headline);font-weight:600;font-size:0.8rem;color:var(--primary);cursor:pointer;display:inline-flex;align-items:center;gap:0.4rem;transition:background 0.15s; }
    .ai-btn:hover { background:rgba(182,238,224,0.3); }
    .past-card { background:var(--surface-container-low);border-radius:var(--radius);padding:1.5rem;cursor:pointer;transition:transform 0.15s; }
    .past-card:hover { transform:translateY(-2px); }
    /* AI response prose */
    #aiResponse p { font-size:1rem;line-height:1.75;color:var(--on-surface);margin-bottom:0.75rem; }
    #aiResponse p:last-child { margin-bottom:0; }
    #aiResponse ol { padding-left:1.25rem;display:flex;flex-direction:column;gap:0.6rem; }
    #aiResponse ol li { font-size:0.95rem;line-height:1.65;color:var(--on-surface); }
    #aiResponse strong { font-weight:700;color:var(--on-surface); }
    #aiResponse em { font-style:italic; }
  </style>
</head>
<body>
  <main class="main-content" style="max-width:56rem;margin-left:auto;margin-right:auto;">

    <!-- Writing area -->
    <section style="margin-bottom:3rem;">
      <div style="display:flex;flex-direction:column;gap:1.5rem;">
        <div>
          <span class="text-label text-primary" style="display:block;margin-bottom:0.5rem;opacity:0.6;">Today's Entry</span>
          <input class="journal-title" id="journalTitle" type="text" placeholder="Title your reflection..." autocomplete="off"/>
          <p style="color:var(--on-surface-variant);font-size:0.875rem;margin-top:0.25rem;" id="entryMeta"></p>
        </div>
        <textarea class="journal-body" id="journalBody" placeholder="Start writing..."></textarea>
      </div>
    </section>

    <!-- AI Panel -->
    <section style="margin-bottom:3rem;">
      <div class="card-surface" style="position:relative;overflow:hidden;padding:2rem 2.5rem;">
        <div class="glow-bg" style="width:16rem;height:16rem;background:rgba(182,238,224,0.25);top:-5rem;right:-5rem;"></div>
        <div style="position:relative;display:flex;flex-direction:column;gap:1.5rem;">
          <div style="display:flex;align-items:center;gap:1rem;">
            <div style="padding:0.75rem;background:var(--primary-container);color:var(--on-primary-container);border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;">
              <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">auto_awesome</span>
            </div>
            <div>
              <h3 class="headline" style="font-size:1.1rem;font-weight:700;">AI Reflection Assistant</h3>
              <p style="font-size:0.8rem;color:var(--on-surface-variant);">Powered by AI — tap to analyze your thoughts</p>
            </div>
          </div>

          <div style="display:flex;flex-wrap:wrap;gap:0.75rem;">
            <button class="ai-btn" onclick="aiAction('reframe')">
              <span class="material-symbols-outlined" style="font-size:1rem;">psychology</span> Reflect &amp; Reframe
            </button>
            <button class="ai-btn" onclick="aiAction('summarize')">
              <span class="material-symbols-outlined" style="font-size:1rem;">summarize</span> Summarize
            </button>
            <button class="ai-btn" onclick="aiAction('suggest')">
              <span class="material-symbols-outlined" style="font-size:1rem;">verified</span> Suggest coping strategies
            </button>
          </div>

          <div id="aiResponse" style="display:none;background:rgba(255,255,255,0.7);backdrop-filter:blur(8px);border-radius:var(--radius);padding:1.5rem;"></div>
        </div>
      </div>
    </section>

    <!-- Past entries -->
    <section>
      <h3 class="headline" style="font-size:1.4rem;font-weight:700;margin-bottom:1.5rem;">Past Reflections</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;" id="pastEntries"></div>
    </section>

  </main>

  <!-- Save FAB -->
  <button id="saveFab" style="position:fixed;right:1.5rem;bottom:5rem;width:3.5rem;height:3.5rem;background:var(--primary);color:var(--on-primary);border:none;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(51,104,93,0.3);transition:transform 0.15s;z-index:40;" aria-label="Save entry">
    <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">save</span>
  </button>

  <!-- Entry View Modal -->
  <div id="entryViewModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:1rem;">
    <div style="background:var(--surface);border-radius:var(--radius);width:100%;max-width:38rem;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;">
      <!-- Header -->
      <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:1.75rem 2rem 1rem;border-bottom:1px solid rgba(169,180,176,0.15);gap:1rem;">
        <div style="flex:1;min-width:0;">
          <h3 id="viewEntryTitle" class="headline" style="font-size:1.4rem;font-weight:800;margin-bottom:0.25rem;word-break:break-word;"></h3>
          <p id="viewEntryDate" style="font-size:0.8rem;color:var(--on-surface-variant);"></p>
        </div>
        <button class="icon-btn" onclick="closeEntry()" aria-label="Close">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <!-- Body -->
      <div style="padding:1.75rem 2rem;flex:1;">
        <p id="viewEntryBody" style="font-size:1rem;line-height:1.8;color:var(--on-surface);white-space:pre-wrap;word-break:break-word;"></p>

        <!-- AI reflection (shown only if exists) -->
        <div id="viewEntryAi" style="display:none;margin-top:1.5rem;background:var(--surface-container-low);border-radius:var(--radius);padding:1.25rem;">
          <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem;">
            <span class="material-symbols-outlined" style="color:var(--primary);font-size:1.1rem;font-variation-settings:'FILL' 1;">auto_awesome</span>
            <span id="viewEntryAiAction" class="text-label" style="color:var(--primary);font-weight:700;"></span>
          </div>
          <div id="viewEntryAiBody" style="font-size:0.9rem;line-height:1.7;color:var(--on-surface-variant);"></div>
        </div>
      </div>
      <!-- Actions -->
      <div style="display:flex;justify-content:flex-end;gap:0.75rem;padding:1rem 2rem 1.5rem;border-top:1px solid rgba(169,180,176,0.15);">
        <button onclick="deleteEntry()" style="display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.25rem;border-radius:var(--radius-full);border:1px solid rgba(186,26,26,0.3);background:transparent;color:var(--error);font-family:var(--font-headline);font-size:0.85rem;font-weight:700;cursor:pointer;">
          <span class="material-symbols-outlined" style="font-size:1rem;">delete</span> Delete
        </button>
        <button onclick="editEntry()" class="btn-primary" style="padding:0.6rem 1.25rem;">
          <span class="material-symbols-outlined" style="font-size:1rem;">edit</span> Edit
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components/nav.js"></script>
  <script src="js/journal.js"></script>
</body>
</html>
