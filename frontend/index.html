<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MindSpace — Welcome</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body style="background: linear-gradient(135deg, #f6faf7 0%, #e7f0ec 50%, #caf9dc 100%); min-height:100vh;">

  <!-- Atmospheric blobs -->
  <div class="glow-bg" style="width:24rem;height:24rem;background:rgba(182,238,224,0.3);top:-6rem;left:-6rem;"></div>
  <div class="glow-bg" style="width:24rem;height:24rem;background:rgba(202,249,220,0.3);bottom:-6rem;right:-6rem;"></div>

  <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;position:relative;z-index:1;">
    <div style="width:100%;max-width:28rem;">

      <!-- Brand -->
      <div style="text-align:center;margin-bottom:2.5rem;">
        <div style="display:inline-flex;align-items:center;justify-content:center;width:4rem;height:4rem;background:var(--primary);border-radius:1rem;margin-bottom:1rem;box-shadow:0 8px 24px rgba(51,104,93,0.2);">
          <span class="material-symbols-outlined" style="color:var(--on-primary);font-size:2rem;font-variation-settings:'FILL' 1;">spa</span>
        </div>
        <h1 class="headline" style="font-size:2.25rem;font-weight:800;color:var(--on-surface);letter-spacing:-0.02em;">MindSpace</h1>
        <p style="color:var(--on-surface-variant);font-size:1.05rem;margin-top:0.25rem;">Welcome back. Let's check in with you.</p>
      </div>

      <!-- Card -->
      <div class="glass-card" style="padding:2.5rem;">
        <form id="loginForm" novalidate>
          <div style="margin-bottom:1.25rem;">
            <label class="text-label" style="display:block;margin-bottom:0.5rem;margin-left:0.25rem;color:var(--on-surface-variant);">Email Address</label>
            <input class="input-field" id="email" type="email" placeholder="name@example.com" required autocomplete="email"/>
          </div>
          <div style="margin-bottom:1.5rem;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;padding:0 0.25rem;">
              <label class="text-label" style="color:var(--on-surface-variant);">Password</label>
              <a href="#" style="font-size:0.625rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--primary);">Forgot password</a>
            </div>
            <div style="position:relative;">
              <input class="input-field" id="password" type="password" placeholder="••••••••" required autocomplete="current-password" style="padding-right:3rem;"/>
              <button type="button" id="togglePwd" class="icon-btn" style="position:absolute;right:0.5rem;top:50%;transform:translateY(-50%);">
                <span class="material-symbols-outlined" style="font-size:1.25rem;">visibility</span>
              </button>
            </div>
          </div>
          <p id="loginError" style="color:var(--error);font-size:0.8rem;margin-bottom:0.75rem;display:none;"></p>
          <button class="btn-primary" type="submit" id="loginBtn" style="width:100%;justify-content:center;font-size:1rem;">
            Login
            <span class="material-symbols-outlined">arrow_forward</span>
          </button>
        </form>

        <!-- Divider -->
        <div style="display:flex;align-items:center;margin:1.5rem 0;">
          <div style="flex:1;height:1px;background:rgba(169,180,176,0.3);"></div>
          <span style="margin:0 1rem;font-size:0.7rem;font-weight:500;text-transform:uppercase;letter-spacing:0.1em;color:var(--outline);">or</span>
          <div style="flex:1;height:1px;background:rgba(169,180,176,0.3);"></div>
        </div>

        <div style="display:flex;flex-direction:column;gap:0.75rem;">
          <button class="btn-surface" type="button" id="googleBtn" style="width:100%;justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Continue with Google
          </button>
          <a href="dashboard.html" style="text-align:center;padding:0.5rem;color:var(--on-surface-variant);font-size:0.875rem;font-weight:500;text-decoration:none;transition:color 0.15s;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--on-surface-variant)'">
            Continue as Guest
          </a>
        </div>
      </div>

      <!-- Footer -->
      <div style="margin-top:2rem;text-align:center;">
        <p style="color:var(--on-surface-variant);font-size:0.875rem;">
          New to the sanctuary?
          <a href="register.html" style="color:var(--primary);font-weight:700;margin-left:0.25rem;text-decoration:none;">Register</a>
        </p>
        <div style="display:flex;justify-content:center;gap:1.5rem;margin-top:1rem;">
          <a href="#" style="font-size:0.625rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--outline);text-decoration:none;">Privacy Policy</a>
          <a href="#" style="font-size:0.625rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--outline);text-decoration:none;">Terms of Service</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
